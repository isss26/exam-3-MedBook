{% extends 'base.html' %}
{% block title %}Удалить отзыв{% endblock %}
{% block content %}
<div class="card card-body" style="max-width:520px">
    <h1 class="h4">Удалить отзыв о враче {{ review.doctor }}?</h1>
    <p class="text-muted">★ {{ review.rating }}{% if review.text %} — {{ review.text|truncatechars:100 }}{% endif %}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Удалить</button>
        <a href="{% url 'doctors:doctor_detail' review.doctor_id %}" class="btn btn-link">Отмена</a>
    </form>
</div>
{% endblock %}
