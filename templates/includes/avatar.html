{# Аватар: фото или монограмма. Параметры: u (пользователь), photo (необязательно), cls (размер) #}
<span class="avatar {{ cls }}" data-name="{{ u.username }}" aria-hidden="true">{% if photo %}<img src="{{ photo.url }}" alt="">{% elif u.first_name or u.last_name %}{{ u.first_name|first|upper }}{{ u.last_name|first|upper }}{% else %}{{ u.username|first|upper }}{% endif %}</span>
