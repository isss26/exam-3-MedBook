{% extends 'base.html' %}
{% block title %}Новая специализация{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'doctors:specialization_list' %}">{% include 'includes/icon.html' with name='back' %}Специализации</a>
<header class="page-head"><div><h1>Новая специализация</h1></div></header>
<form method="post" class="panel panel--narrow" novalidate>
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <div class="form-actions">
        <button class="button button--primary">Добавить специализацию</button>
        <a href="{% url 'doctors:specialization_list' %}" class="button button--ghost">Отмена</a>
    </div>
</form>
{% endblock %}
