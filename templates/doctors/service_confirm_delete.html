{% extends 'base.html' %}
{% block title %}Удалить услугу{% endblock %}
{% block content %}
<div class="panel confirm">
    <div class="confirm__icon">{% include 'includes/icon.html' with name='trash' %}</div>
    <h1>Удалить услугу «{{ object.name }}»?</h1>
    <p>Услуга исчезнет из профилей всех врачей. Это действие нельзя отменить.</p>
    <form method="post" class="button-row">
        {% csrf_token %}
        <a href="{% url 'doctors:service_list' %}" class="button">Отмена</a>
        <button class="button button--danger">Удалить услугу</button>
    </form>
</div>
{% endblock %}
