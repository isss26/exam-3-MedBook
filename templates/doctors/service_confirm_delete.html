{% extends 'base.html' %}
{% block title %}Удалить услугу{% endblock %}
{% block content %}
<div class="card card-body" style="max-width:520px">
    <h1 class="h4">Удалить услугу «{{ object.name }}»?</h1>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Удалить</button>
        <a href="{% url 'doctors:service_list' %}" class="btn btn-link">Отмена</a>
    </form>
</div>
{% endblock %}
