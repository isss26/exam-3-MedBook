{% extends 'base.html' %}
{% block title %}{% if object %}Изменить услугу{% else %}Новая услуга{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Изменить услугу{% else %}Новая услуга{% endif %}</h1>
<form method="post" class="card card-body" style="max-width:520px">
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <div>
        <button class="btn btn-primary">Сохранить</button>
        <a href="{% url 'doctors:service_list' %}" class="btn btn-link">Отмена</a>
    </div>
</form>
{% endblock %}
